# Полный запуск стенда:  docker compose up --build
#
# Поднимает PostgreSQL, прогоняет все *.up.sql миграции и стартует API
# с бутстрапным admin-аккаунтом. Healthcheck'и обеспечивают порядок старта.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pro100_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pro100_kartochki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pro100_kartochki"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Одноразовый прогон миграций. Идемпотентен (CREATE ... IF NOT EXISTS).
  migrate:
    image: postgres:16-alpine
    container_name: pro100_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: postgres
    entrypoint: ["sh", "-c"]
    command: |
      'for f in /migrations/*.up.sql; do
        echo "==> applying $$f";
        psql -h postgres -U postgres -d pro100_kartochki -v ON_ERROR_STOP=1 -f "$$f" || exit 1;
      done'
    restart: "no"

  api:
    build: .
    container_name: pro100_api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pro100_kartochki
      DB_SSLMODE: disable
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      SERVER_PORT: 8080
      SERVER_BASE_URL: http://localhost:8080
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin1234}
      PASSWORD_RESET_RETURN_TOKEN: "true"
      # SMTP (опционально). Если не задать — письма не отправляются, только лог.
      # Пробрасываются с хоста: положи в .env (или экспортни перед `docker compose up`).
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
